name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Bootstrap Android project
        run: |
          rm -rf android/
          flutter create . --org com.sikuris --platforms android --project-name sikuris_app
          git checkout -- lib/ pubspec.yaml 2>/dev/null || true

      - name: Aplicar config Android con Firebase
        run: |
          cp android_config/settings.gradle android/settings.gradle
          cp android_config/build.gradle android/build.gradle
          cp android_config/app/build.gradle android/app/build.gradle
          cp firebase/google-services.json android/app/google-services.json

          echo "===== android/settings.gradle ====="
          cat android/settings.gradle
          echo ""
          echo "===== android/build.gradle ====="
          cat android/build.gradle
          echo ""
          echo "===== android/app/build.gradle (primeras 30) ====="
          head -30 android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sikuris-apk
          path: build/app/outputs/flutter-apk/app-release.apk