name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Bootstrap Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.sikuris --platforms android --project-name sikuris_app
            git checkout -- lib/main.dart 2>/dev/null || true
          fi

      - name: Setup Firebase config
        run: |
          if [ -f "firebase/google-services.json" ]; then
            cp firebase/google-services.json android/app/google-services.json
          fi

          # === ROOT build.gradle (proyecto) ===
          if [ -f "android/build.gradle.kts" ]; then
            if ! grep -q "com.google.gms.google-services" android/build.gradle.kts; then
              sed -i '0,/^plugins {/s//plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/build.gradle.kts
            fi
          elif [ -f "android/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/build.gradle; then
              if grep -q "^plugins {" android/build.gradle; then
                sed -i '0,/^plugins {/s//plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/build.gradle
              else
                awk '/dependencies \{/ && !done {print; print "        classpath \"com.google.gms:google-services:4.4.2\""; done=1; next} 1' android/build.gradle > tmp.gradle && mv tmp.gradle android/build.gradle
              fi
            fi
          fi

          # === APP build.gradle (módulo app) ===
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle.kts; then
              sed -i '0,/^plugins {/s//plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
            fi
          elif [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              if grep -q "^plugins {" android/app/build.gradle; then
                sed -i '0,/^plugins {/s//plugins {\n    id "com.google.gms.google-services"/' android/app/build.gradle
              else
                echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
              fi
            fi
          fi

          echo "=== ROOT build.gradle (primeras 20 líneas) ==="
          head -20 android/build.gradle 2>/dev/null || head -20 android/build.gradle.kts 2>/dev/null || true
          echo "=== APP build.gradle (primeras 15 líneas) ==="
          head -15 android/app/build.gradle 2>/dev/null || head -15 android/app/build.gradle.kts 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sikuris-apk
          path: build/app/outputs/flutter-apk/app-release.apk
